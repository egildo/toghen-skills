# Copied from house 0.1.0. Change it in house, then copy it out again.
# Runs on the GitHub mirror; the repository itself lives on Codeberg.
# skills holds no code: only the purity check runs here.
# Actions are pinned by commit, with the release in a comment. Without the
# PURITY_NAMES secret the check fails: under CI, nothing checked is not a pass.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - name: purity
        env:
          PURITY_NAMES: ${{ secrets.PURITY_NAMES }}
        run: |
          if [ -n "$PURITY_NAMES" ]; then
            printf '%s\n' "$PURITY_NAMES" > "$RUNNER_TEMP/purity-names"
            export TOGHEN_PURITY_NAMES="$RUNNER_TEMP/purity-names"
          fi
          node scripts/check-purity.mjs
